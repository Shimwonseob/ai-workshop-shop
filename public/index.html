<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nouri</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="utility"><div class="shell utility-inner"><span>매일의 식탁을 위한 장보기</span><nav id="auth-menu"><a href="/login" data-link>로그인</a><a href="/signup" data-link>회원가입</a></nav></div></div>
    <div class="header-main shell">
      <a class="brand" href="/" data-link>Nouri</a>
      <form id="search-form" class="search"><input id="search-input" placeholder="찾고 싶은 상품을 검색해보세요"><button type="submit" aria-label="검색">⌕</button></form>
      <a class="cart-link" href="/cart" data-link>장바구니 <span id="cart-count"></span></a>
    </div>
    <nav class="main-nav shell" aria-label="주요 메뉴">
      <button id="category-toggle" type="button" aria-expanded="false" aria-controls="category-menu"><span class="menu-icon">☰</span> 카테고리</button>
      <a href="/?collection=new" data-link>신상품</a><a href="/?collection=best" data-link>베스트</a><a href="/?collection=value" data-link><span id="value-link-text">알뜰쇼핑</span></a><a href="/?collection=special" data-link>특가혜택</a>
    </nav>
    <div id="category-menu" class="category-menu" hidden><div class="shell category-menu-inner"><a data-link href="/category/간편식">간편식</a><a data-link href="/category/베이커리">베이커리</a><a data-link href="/category/신선식품">신선식품</a><a data-link href="/category/반찬">반찬</a></div></div>
  </header>
  <main id="app"></main>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/auth.js"></script>
</body>
</html>
